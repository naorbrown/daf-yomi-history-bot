name: Send Daily Daf Yomi History Video

on:
  schedule:
    # 3:00 AM Israel time = 1:00 UTC (winter) / 0:00 UTC (summer)
    # Deduplication is handled by state file, not time windows,
    # so both crons can safely fire — only the first will actually send.
    - cron: '0 1 * * *'  # Winter (IST, UTC+2): 3:00 AM
    - cron: '0 0 * * *'  # Summer (IDT, UTC+3): 3:00 AM

  # Allow manual trigger (owner only via GitHub UI)
  workflow_dispatch:
    inputs:
      skip_dedup_check:
        description: 'Skip deduplication check (to re-send today)'
        required: false
        default: 'true'
        type: boolean
      override_date:
        description: 'Override date (YYYY-MM-DD) to send a specific day'
        required: false
        default: ''
        type: string

# Permissions: Need write access to save broadcast state
permissions:
  contents: write  # Write access needed to save last_broadcast.json

# Concurrency: prevent overlapping runs, but don't cancel in-progress
# to avoid race conditions where a cancelled run doesn't save state
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  send-video:
    runs-on: ubuntu-latest

    # Security: Set timeout to prevent runaway processes
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir httpx beautifulsoup4 python-telegram-bot

      - name: Send daily video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Skip dedup check for manual triggers, enforce for scheduled runs
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_dedup_check || 'false' }}
          # Override date for sending a specific day's video
          OVERRIDE_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.override_date || '' }}
          # Unified Torah Yomi Channel
          TORAH_YOMI_CHANNEL_ID: ${{ secrets.TORAH_YOMI_CHANNEL_ID }}
          TORAH_YOMI_CHANNEL_BOT_TOKEN: ${{ secrets.TORAH_YOMI_CHANNEL_BOT_TOKEN }}
          TORAH_YOMI_PUBLISH_ENABLED: ${{ secrets.TORAH_YOMI_PUBLISH_ENABLED }}
        run: |
          python send_video.py

      - name: Commit broadcast state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase || true
          git add .github/state/last_broadcast.json || true
          git diff --staged --quiet || git commit -m "chore: update broadcast state [skip ci]"
          git push
