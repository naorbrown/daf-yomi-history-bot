name: Send Daily Daf Yomi History Video

on:
  schedule:
    # 3:00 AM Israel time - single cron job at 1:00 UTC
    # Winter (Nov-Mar): 1:00 UTC = 3:00 AM IST (exact)
    # Summer (Apr-Oct): 1:00 UTC = 4:00 AM IDT (within send window)
    # The script uses the send window (2:00-5:00 AM Israel) to handle both cases
    - cron: '0 1 * * *'

  # Allow manual trigger for testing (owner only via GitHub UI)
  workflow_dispatch:
    inputs:
      skip_time_check:
        description: 'Skip time window check (for testing)'
        required: false
        default: 'true'
        type: boolean

# Permissions: Need write access to save broadcast state
permissions:
  contents: write  # Write access needed to save last_broadcast.json

# Concurrency: prevent overlapping runs, but don't cancel in-progress
# to avoid race conditions where a cancelled run doesn't save state
concurrency:
  group: daily-video
  cancel-in-progress: false

jobs:
  send-video:
    runs-on: ubuntu-latest

    # Security: Set timeout to prevent runaway processes
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir httpx beautifulsoup4 python-telegram-bot

      - name: Send daily video
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Skip time check for manual triggers, enforce for scheduled runs
          SKIP_TIME_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_time_check || 'false' }}
          # Unified Torah Yomi Channel
          TORAH_YOMI_CHANNEL_ID: ${{ secrets.TORAH_YOMI_CHANNEL_ID }}
          TORAH_YOMI_CHANNEL_BOT_TOKEN: ${{ secrets.TORAH_YOMI_CHANNEL_BOT_TOKEN }}
          TORAH_YOMI_PUBLISH_ENABLED: ${{ secrets.TORAH_YOMI_PUBLISH_ENABLED }}
        run: |
          python send_video.py

      - name: Commit broadcast state
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --rebase || true
          git add .github/state/last_broadcast.json || true
          git diff --staged --quiet || git commit -m "chore: update broadcast state [skip ci]"
          git push
